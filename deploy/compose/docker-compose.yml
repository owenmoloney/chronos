services:

    postgres:
      image: postgres:16
      environment:
        POSTGRES_USER: chronos
        POSTGRES_PASSWORD: chronos
        POSTGRES_DB: chronos
      ports:
        - "5432:5432"
      volumes: 
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
        interval: 5s
        timeout: 5s
        retries: 5
    
    redis:
      image: redis:7
      ports:
        - "6379:6379"

volumes:
  postgres_data: {}