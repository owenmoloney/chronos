name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
          POSTGRES_DB: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://chronos:chronos@localhost:5432/chronos?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: |
          go test ./internal/execute/ ./internal/job/ ./internal/cron/ -count=1

      - name: Install migrate
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/

      - name: Migrate
        run: ./scripts/migrate.sh up

      - name: Store integration tests
        run: go test ./internal/store/ -count=1
      
      - name: API integration tests
        run: go test ./internal/api/ -count=1
      
      - name: Worker execution-semantics test
        run: go test ./internal/worker/ -run TestAtLeastOnceExecutionAfterCrashBeforeComplete -count=1
